<title>Generador de Ganchos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: una sola lista larga, agrupada por tipo; los huecos se rellenan dentro de la frase. */
:root {
  --bg: #ffffff;
  --ink: #18181b;
  --muted: #71717a;
  --line: #e7e7ea;
  --blank: #fff1b8;
  --accent: #e11d48;
  --font: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121214; --ink: #f2f2f3; --muted: #a1a1aa; --line: #2a2a2e; --blank: #4a3f12; --accent: #fb7185; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121214; --ink: #f2f2f3; --muted: #a1a1aa; --line: #2a2a2e; --blank: #4a3f12; --accent: #fb7185; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font: 17px/1.5 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 60px;
}
.wrap { max-width: 640px; margin: 0 auto; }
h1 { font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
.intro { color: var(--muted); margin: 6px 0 16px; font-size: 15px; }
.intro mark { background: var(--blank); color: var(--ink); border-radius: 4px; padding: 0 4px; }
.search { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.jump { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; margin-bottom: 8px; }
.jump a { flex: none; font-size: 14px; color: var(--ink); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }
.jump a:hover { border-color: var(--accent); }
h2 { font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin: 28px 0 4px; scroll-margin-top: 16px; }
ol { list-style: none; margin: 0; padding: 0; }
li { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.say { flex: 1; min-width: 0; font-size: 18px; font-weight: 600; line-height: 1.6; overflow-wrap: anywhere; }
.say input {
  font: inherit; color: inherit; background: var(--blank); border: 0; border-radius: 6px;
  padding: 0 6px; margin: 0 1px; min-width: 3ch; max-width: 100%;
}
.say input::placeholder { color: var(--muted); font-weight: 400; }
.say input:focus { outline: 2px solid var(--accent); }
.say input.done { background: transparent; box-shadow: inset 0 -2px 0 var(--blank); border-radius: 0; }
button.copy { flex: none; font: 600 14px var(--font); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
button.copy:hover { border-color: var(--accent); }
button.copy.ok { color: var(--accent); border-color: var(--accent); }
.none { color: var(--muted); padding: 24px 0; text-align: center; }
.tip { margin-top: 32px; color: var(--muted); font-size: 14px; }
</style>

<div class="wrap">
  <h1>Ganchos para TikTok</h1>
  <p class="intro">Toca un <mark>hueco</mark>, escribe tu información y copia el gancho listo.</p>
  <input class="search" id="buscar" type="search" placeholder="Buscar gancho…" aria-label="Buscar gancho">
  <nav class="jump" id="saltos"></nav>
  <div id="lista"></div>
  <p class="tip">Consejo: los mejores ganchos tienen menos de 12 palabras y van directo, sin saludar.</p>
</div>

<script>
// Lista completa de ganchos. Lo que va entre [corchetes] es un hueco para rellenar.
const GANCHOS = {
  "Pregunta": [
    "¿Sabías que [dato curioso]?",
    "¿Por qué nadie habla de [tema]?",
    "¿Te pasa que [problema]?",
    "¿Quieres [resultado] sin complicarte?",
    "¿Y si te digo que [resultado] es más fácil de lo que crees?",
    "¿Por qué [problema]? Te explico",
    "¿Todavía [error]?",
    "¿Cuánto crees que cuesta [cosa]?",
    "¿Qué harías si [situación]?",
    "¿Tú también [problema]?",
  ],
  "Error": [
    "Deja de [error] si quieres [resultado]",
    "El error que casi todos cometen con [tema]",
    "Si quieres [resultado], no vuelvas a [error]",
    "[Error] te está costando caro",
    "Yo también hacía esto mal con [tema]",
    "Estás haciendo mal [tema] y no lo sabes",
    "Nunca más vuelvas a [error]",
    "Este error me costó [cantidad]",
  ],
  "Secreto": [
    "Nadie te dice esto sobre [tema]",
    "El truco que nadie te cuenta para [resultado]",
    "Lo que [personas] no quieren que sepas",
    "Así es como logré [resultado]",
    "Ojalá alguien me hubiera dicho esto sobre [tema]",
    "Esto debí saberlo hace años",
    "El secreto de [personas] para [resultado]",
    "Esto es lo que nadie te enseña de [tema]",
  ],
  "Dato": [
    "[Dato]. Y casi nadie lo sabe",
    "[Número] de cada 10 personas [error]",
    "Esto cambia todo lo que sabes de [tema]",
    "En [tiempo] logré [resultado]. Así lo hice",
    "Gasté [cantidad] para aprender esto. Tú gratis",
    "Con solo [cantidad] puedes [resultado]",
  ],
  "POV": [
    "POV: acabas de descubrir [cosa]",
    "POV: por fin entiendes [tema]",
    "POV: eres [público] y [problema]",
    "POV: alguien te explica [tema] fácil",
    "POV: descubres que [error] era el problema",
    "POV: es tu primer día de [actividad]",
  ],
  "Lista": [
    "[Número] cosas que nadie te dijo de [tema]",
    "[Número] errores que te impiden [resultado]",
    "[Número] trucos para [resultado]",
    "[Número] cosas que hago antes de [acción]",
    "[Número] señales de que [situación]",
    "[Número] cosas que dejé de hacer para [resultado]",
    "[Número] cosas que me hubiera gustado saber de [tema]",
  ],
  "Antes y después": [
    "Así estaba… así quedó",
    "Antes [antes]. Ahora [después]",
    "Hace un año [situación]. Hoy [resultado]",
    "Mira la diferencia con un solo cambio",
    "Así pasé de [antes] a [después]",
    "Lo que cambió cuando dejé de [error]",
  ],
  "Opinión": [
    "Opinión impopular: [idea]",
    "Me van a odiar por decir esto",
    "Lo que te enseñaron sobre [tema] no funciona",
    "[Cosa popular] no sirve. Te explico por qué",
    "Nadie quiere aceptarlo, pero [idea]",
    "Voy a decir lo que nadie se atreve sobre [tema]",
  ],
  "Curiosidad": [
    "Lo que pasó después nadie lo esperaba",
    "Probé [cosa] por [tiempo] y pasó esto",
    "Mira hasta el final, no te lo vas a creer",
    "Esto es lo último que esperas de [tema]",
    "No sabía que [cosa] podía hacer esto",
    "Nadie me creyó cuando dije [idea]",
  ],
  "Llamado directo": [
    "Si tienes [problema], mira esto",
    "Si eres [público], esto es para ti",
    "Guarda este video si quieres [resultado]",
    "No sigas bajando si te importa [tema]",
    "Si [problema], tengo algo para ti",
    "Esto es para ti si [situación]",
    "Comparte esto con alguien que [problema]",
  ],
  "Historia": [
    "El día que [situación], todo cambió",
    "Casi me rindo con [tema], hasta que pasó esto",
    "Te cuento cómo pasé de [antes] a [después]",
    "Nunca pensé que [cosa] me pasaría a mí",
    "Así empecé con [tema] sin saber nada",
    "Esto me pasó por [error]",
  ],
  "Mito o verdad": [
    "¿Mito o verdad? [creencia]",
    "Esto que crees de [tema] es mentira",
    "Te dijeron que [creencia]. No es así",
    "Todos creen que [creencia], pero no",
  ],
  "Advertencia": [
    "No compres [cosa] sin ver esto",
    "Cuidado con [cosa], te puede costar caro",
    "Antes de [acción], mira este video",
    "Si vas a [acción], no hagas esto",
    "Ojo si usas [cosa]",
  ],
  "Reto": [
    "Te reto a [acción] por [tiempo]",
    "A que no sabías hacer esto con [cosa]",
    "Solo el 1% sabe esto de [tema]",
    "Intenta esto por [tiempo] y me cuentas",
  ],
  "Comparación": [
    "[Opción A] o [opción B]: ¿cuál conviene?",
    "Lo barato contra lo caro: [cosa]",
    "Lo que hace la mayoría vs. lo que funciona",
    "Probé [opción A] y [opción B]. Este ganó",
  ],
  "Paso a paso": [
    "Cómo [resultado] en [número] pasos",
    "Así se hace [cosa] en menos de un minuto",
    "La forma más fácil de [acción]",
    "Así puedes [resultado] desde hoy",
    "Te enseño a [acción] en 30 segundos",
  ],
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-");

// Convierte "[tema]" en un hueco editable dentro de la frase.
const conHuecos = (t) => esc(t).replace(/\[([^\]]+)\]/g, (_, h) => `<input type="text" placeholder="${h}" style="width:${h.length + 1}ch" aria-label="${h}">`);

$("#saltos").innerHTML = Object.keys(GANCHOS).map((tipo) => `<a href="#${slug(tipo)}">${esc(tipo)}</a>`).join("");
$("#lista").innerHTML = Object.entries(GANCHOS).map(([tipo, lista]) => `
  <section data-grupo>
    <h2 id="${slug(tipo)}">${esc(tipo)}</h2>
    <ol>${lista.map((t) => `<li data-texto="${esc(t.toLowerCase())}"><span class="say">${conHuecos(t)}</span><button type="button" class="copy">Copiar</button></li>`).join("")}</ol>
  </section>`).join("") + '<p class="none" id="nada" hidden>No hay ganchos con esa palabra.</p>';

// El hueco crece con lo que escribes y deja de verse amarillo cuando lo llenas.
$("#lista").addEventListener("input", (e) => {
  const i = e.target;
  if (i.tagName !== "INPUT") return;
  i.style.width = `${Math.max(i.placeholder.length, i.value.length) + 1}ch`;
  i.classList.toggle("done", i.value.trim() !== "");
});

function textoFinal(li) {
  let out = "";
  li.querySelector(".say").childNodes.forEach((n) => {
    out += n.nodeType === 3 ? n.textContent : (n.value.trim() || `[${n.placeholder}]`);
  });
  out = out.replace(/\s+/g, " ").trim().replace(/\b([Dd]e) el\b/g, "$1l").replace(/\b([Aa]) el\b/g, "$1l");
  return out.replace(/^(¿|¡)?(\p{Ll})/u, (_, p = "", l) => p + l.toUpperCase());
}

$("#lista").addEventListener("click", async (e) => {
  const b = e.target.closest(".copy");
  if (!b) return;
  const texto = textoFinal(b.closest("li"));
  try {
    await navigator.clipboard.writeText(texto);
    b.textContent = "¡Listo!";
  } catch {
    b.textContent = "No se pudo";
  }
  b.classList.add("ok");
  setTimeout(() => { b.textContent = "Copiar"; b.classList.remove("ok"); }, 1500);
});

$("#buscar").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  let total = 0;
  document.querySelectorAll("[data-grupo]").forEach((g) => {
    let visibles = 0;
    g.querySelectorAll("li").forEach((li) => { const ok = !q || li.dataset.texto.includes(q); li.hidden = !ok; visibles += ok; });
    g.hidden = !visibles;
    total += visibles;
  });
  $("#nada").hidden = total > 0;
});
</script>
